services:
  - type: web
    name: warisango
    runtime: docker
    plan: free
    branch: deploy
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FIREBASE_CREDENTIALS_LOCATION
        value: file:/etc/secrets/firebase-service-account.json
      - key: FIREBASE_ENABLED
        value: "true"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_FILE
        value: /etc/secrets/youtube-cookies.txt
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
