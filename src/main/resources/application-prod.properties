spring.application.name=warisango
server.port=${PORT:8080}

spring.thymeleaf.prefix=classpath:/view/
spring.thymeleaf.suffix=.html

youtube.api.key=${YOUTUBE_API_KEY:}
youtube.base.url=https://www.googleapis.com/youtube/v3
assemblyai.api.key=${ASSEMBLYAI_API_KEY:}
assemblyai.api.url=https://api.assemblyai.com/v2
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

firebase.enabled=${FIREBASE_ENABLED:true}
warisango.firebase.credentials-location=${FIREBASE_CREDENTIALS_LOCATION:file:/etc/secrets/firebase-service-account.json}
warisango.firebase.project-id=${FIREBASE_PROJECT_ID:warisango}
warisango.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:warisango.firebasestorage.app}
warisango.upload.directory=${WARISANGO_UPLOAD_DIRECTORY:/tmp/warisango-uploads}

warisango.review.max-photo-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
warisango.check-in.enforce-distance-limit=true