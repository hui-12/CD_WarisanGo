youtube.base.url=https://www.googleapis.com/youtube/v3

# AssemblyAI
assemblyai.api.key=11b0226c03b14560b57e0848f0ca1d4a
assemblyai.api.url=https://api.assemblyai.com/v2

# Gemini 
gemini.api.key=AQ.Ab8RN6JRLK95m59gIjVBKMN3pkGBNI6gBKpjZqAg7_HubTVvHA
gemini.model=gemini-3.6-flash

# Firebase Storage bucket for review images. The bucket location is selected in Firebase Console.
firebase.enabled=${FIREBASE_ENABLED:true}
warisango.firebase.credentials-location=${FIREBASE_CREDENTIALS_LOCATION:classpath:firebase-service-account.json}
warisango.firebase.project-id=${FIREBASE_PROJECT_ID:warisango}
warisango.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:warisango.firebasestorage.app}
warisango.upload.directory=${WARISANGO_UPLOAD_DIRECTORY:uploads}

warisango.review.max-photo-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Production-safe default. The dev profile can disable this for local check-in testing.
warisango.check-in.enforce-distance-limit=true
