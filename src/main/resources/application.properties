spring.application.name=warisango

# change the "template" package name to "view"
spring.thymeleaf.prefix=classpath:/view/
spring.thymeleaf.suffix=.html

# API keys
# Youtube
youtube.api.key=AIzaSyBJ4vG75Fx7VVw051QBe8wiUO0x0pv9QZg
youtube.base.url=https://www.googleapis.com/youtube/v3

# AssemblyAI
assemblyai.api.key=11b0226c03b14560b57e0848f0ca1d4a
assemblyai.api.url=https://api.assemblyai.com/v2

# Gemini 
gemini.api.key=AQ.Ab8RN6JRLK95m59gIjVBKMN3pkGBNI6gBKpjZqAg7_HubTVvHA
gemini.model=gemini-3.6-flash

# Firebase Storage bucket for review images. The bucket location is selected in Firebase Console.
warisango.firebase.storage-bucket=warisango.firebasestorage.app

# Legacy local directory retained for the one-time migration of existing review images.
warisango.review.upload-directory=uploads/reviews
warisango.review.upload-url-prefix=/uploads/reviews
warisango.review.max-photo-size-bytes=10485760
warisango.review.current-tourist-id=${WARISANGO_REVIEW_CURRENT_TOURIST_ID:tourist_001}
# Temporary development identity used for Admin moderation actions.
# AdminRepository still verifies this ID through the admins collection.
warisango.moderation.current-user-id=${WARISANGO_MODERATION_CURRENT_USER_ID:user_001}
# Migrates any existing /uploads/reviews images on the next application start.
warisango.review.migrate-local-photos=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
