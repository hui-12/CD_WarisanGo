<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragments :: head('Review Detail | WarisanGo')}"></head>
<body>

<header th:replace="~{fragments/fragments :: navbar('directory')}"></header>
<link rel="stylesheet" th:href="@{/css/review.css}">

<main class="review-detail-page">

    <article class="review-detail-shell">

        <section class="review-detail-business">

            <img th:src="${business.businessImage}"
                 src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=80"
                 alt="Heritage business">

            <div class="review-detail-business-copy">

                <p class="review-kicker" th:text="${business.category}">
                    Heritage Food
                </p>

                <h1 class="review-detail-business-name"
                    th:text="${business.businessName}">
                    Heritage Business
                </h1>

                <p class="review-detail-business-address"
                   th:text="${business.businessAddress}">
                    Business Address
                </p>

            </div>

        </section>


        <section class="review-detail-body">

            <div class="review-detail-user">

                <div class="review-detail-avatar"
                     th:text="${review.touristName != null and !review.touristName.isEmpty()
                     ? #strings.substring(review.touristName,0,1).toUpperCase()
                     : 'U'}">
                    A
                </div>

                <div>

                    <h2 class="review-detail-user-name"
                        th:text="${review.touristName}">
                        Visitor Name
                    </h2>

                    <div class="review-stars">

                        <span th:each="star : ${#numbers.sequence(1,5)}"
                              th:classappend="${star <= review.rating} ? ' filled' : ''">
                            ★
                        </span>

                    </div>

                    <p class="review-detail-date">
                        Reviewed on <span th:text="${review.createdAt}">2026-08-14</span>
                    </p>

                </div>

            </div>


            <p class="review-detail-text"
               th:text="${review.reviewText}">
                Full review content.
            </p>


            <div class="review-detail-photos"
                 th:if="${review.photoUrls != null and !#lists.isEmpty(review.photoUrls)}">

                <img th:each="photo : ${review.photoUrls}"
                     th:src="${photo}"
                     alt="Review photo">

            </div>


            <div class="review-detail-actions">

                <button class="review-detail-action"
                        type="button"
                        data-review-like>
                    ♡ Like <span>0</span>
                </button>

                <a class="review-detail-action"
                   href="#comments">
                    💬 Comments
                </a>

            </div>


            <h2 id="comments" class="review-comments-title">
                Comments
            </h2>

            <div class="review-comment-feed"
                 th:if="${comments != null and !#lists.isEmpty(comments)}">

                <article class="review-comment-full"
                         th:each="comment : ${comments}">

                    <p class="review-comment-full-user"
                       th:text="${comment.touristName}">
                        Visitor
                    </p>

                    <span class="review-comment-full-date"
                          th:text="${comment.createdAt}">
                        2026-08-14
                    </span>

                    <p class="review-comment-full-text"
                       th:text="${comment.commentText}">
                        Comment text.
                    </p>

                    <button type="button"
                            class="review-detail-action"
                            data-comment-like>
                        ♡ Like <span>0</span>
                    </button>

                </article>

            </div>

            <div class="review-empty"
                 th:if="${comments == null or #lists.isEmpty(comments)}">

                <p class="review-empty-text">
                    No comments yet.
                </p>

            </div>


            <div class="review-bottom-actions">

                <a class="review-btn-outline"
                   th:href="@{/reviews/{id}(id=${business.businessId})}">
                    Back to Reviews
                </a>

                <a class="review-btn-primary"
                   th:if="${currentUserId != null and review.touristId == currentUserId}"
                   th:href="@{/reviews/edit/{id}(id=${review.reviewId})}">
                    Edit Review
                </a>

            </div>

        </section>

    </article>

</main>

<footer th:replace="~{fragments/footer :: global}"></footer>
<script th:src="@{/js/review.js}"></script>

</body>
</html>
