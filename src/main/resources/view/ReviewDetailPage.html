<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Detail | WarisanGo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f1e7;color:#2f261d;font-family:'Poppins',Arial,sans-serif}
a{text-decoration:none;color:inherit}
.page{max-width:980px;margin:0 auto;padding:34px 22px 48px}
.detail-card{background:#fff;border:1px solid #ecdfcf;border-radius:8px;box-shadow:0 12px 34px rgba(111,73,37,.1);overflow:hidden}
.business-strip{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;background:#fffaf3;border-bottom:1px solid #ead9c4}
.business-strip img{width:100%;height:170px;object-fit:cover}
.business-copy{padding:20px 22px 20px 0}
.eyebrow{margin:0 0 8px;color:#b15f24;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
h1{margin:0 0 8px;font-size:30px;line-height:1.2}
h2{margin:0 0 8px;font-size:22px}
.muted{margin:0;color:#725f4e}
.review-body{padding:26px}
.reviewer{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#f2d5b5;color:#9f5422;font-weight:800}
.stars{display:inline-flex;gap:2px;color:#d7c6b2;font-size:22px;letter-spacing:0}
.stars .filled{color:#f3a51f}
.review-text{font-size:18px;line-height:1.8;margin:18px 0;color:#382c24}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}
.photos img{width:100%;height:180px;object-fit:cover;border-radius:8px;border:1px solid #ead9c4}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.primary-btn,.ghost-btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;font-family:inherit}
.primary-btn{background:#c66b2e;color:#fff;box-shadow:0 10px 24px rgba(198,107,46,.22)}
.ghost-btn{background:#fff;color:#6d5542;border:1px solid #e2d0bc}
@media (max-width:720px){
    .business-strip{grid-template-columns:1fr}
    .business-strip img{height:210px}
    .business-copy{padding:0 20px 20px}
    .primary-btn,.ghost-btn{width:100%}
}
</style>
</head>
<body>
<main class="page">
    <article class="detail-card">
        <section class="business-strip">
            <img th:src="${business.businessImage}" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=900&q=80" alt="Heritage business">
            <div class="business-copy">
                <p class="eyebrow" th:text="${business.category}">Heritage Food</p>
                <h1 th:text="${business.businessName}">Kedai Warisan Laksa</h1>
                <p class="muted" th:text="${business.businessAddress}">George Town, Penang, Malaysia</p>
            </div>
        </section>

        <section class="review-body">
            <div class="reviewer">
                <div class="avatar" th:text="${#strings.substring(review.touristName,0,1)}">A</div>
                <div>
                    <h2 th:text="${review.touristName}">Visitor Name</h2>
                    <div class="stars">
                        <span th:each="star : ${#numbers.sequence(1,5)}"
                              th:classappend="${star <= review.rating} ? ' filled' : ''">&#9733;</span>
                    </div>
                    <p class="muted">Reviewed on <span th:text="${review.createdAt}">2026-08-07</span></p>
                </div>
            </div>

            <p class="review-text" th:text="${review.reviewText}">Full review content.</p>

            <div class="photos" th:if="${review.photoUrls != null and !#lists.isEmpty(review.photoUrls)}">
                <img th:each="photo : ${review.photoUrls}" th:src="${photo}" src="" alt="Review photo">
            </div>

            <div class="actions">
                <a class="ghost-btn" th:href="@{/reviews/{id}(id=${business.businessId})}">Back to Reviews</a>
                <a class="primary-btn" th:href="@{/reviews/edit/{id}(id=${review.reviewId})}">Edit Review</a>
            </div>
        </section>
    </article>
</main>
</body>
</html>
