<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heritage Business Directory — WarisanGo</title>
  <style>
    :root{--bg:#f6f8fb;--card:#ffffff;--muted:#6b7280;--accent:#1f6feb;--accent-weak:#e6f0ff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#0f172a}
    .site-header{background:var(--card);border-bottom:1px solid #e6e9ef}
    .container{max-width:1100px;margin:0 auto;padding:20px}
    .branding{display:flex;align-items:center;gap:14px}
    .branding h1{font-size:1.25rem;margin:0}
    .subtitle{color:var(--muted);margin-top:6px;font-size:0.95rem}

    .controls{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px 0}
    .search{display:flex;gap:8px;align-items:center}
    .search input{padding:10px 12px;border-radius:8px;border:1px solid #dbe3f0;min-width:320px}
    .btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}

    .filters{display:flex;gap:8px;align-items:center}
    .filters select{padding:8px;border-radius:8px;border:1px solid #dbe3f0;background:#fff}

    .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
    .card{background:var(--card);padding:14px;border-radius:12px;border:1px solid #e6e9ef;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,23,42,0.03)}
    .thumb{height:160px;border-radius:8px;overflow:hidden;background:#f0f2f6}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{color:var(--muted);font-size:0.9rem}
    .card h3{margin:0;font-size:1.05rem}
    .desc{color:#334155;font-size:0.95rem}

    .card-actions{display:flex;gap:8px;margin-top:auto}
    .link-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid #e6e9ef;background:#fff;color:#0f172a;text-decoration:none}

    .no-results{padding:36px;text-align:center;color:var(--muted)}

    footer.site-footer{padding:28px 0;color:var(--muted)}

    @media (max-width:640px){.controls{flex-direction:column;align-items:stretch}.search input{min-width:140px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="branding">
        <div>
          <h1>WarisanGo</h1>
          <div class="subtitle">Heritage Business Directory</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search by business name..." aria-label="Search business">
        <button id="searchBtn" class="btn" type="button">Search</button>
      </div>

      <div class="filters">
        <select id="categoryFilter"><option value="">All Categories</option></select>
        <select id="stateFilter"><option value="">All States</option></select>
        <select id="cityFilter"><option value="">All Cities</option></select>
        <button id="clearFilters" type="button" class="link-btn">Clear</button>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite">
      <!-- cards inserted by JS -->
    </section>

    <div id="noResults" class="no-results" hidden>No businesses found at the moment.</div>
  </main>

  <footer class="site-footer">
    <div class="container">WarisanGo © VM2026</div>
  </footer>

  <script>
  (function(){
    // Sample data (fallback) — server may inject window.__BUSINESSES__
    const sampleData = window.__BUSINESSES__ && Array.isArray(window.__BUSINESSES__) ? window.__BUSINESSES__ : [
      {id:'b1', name:'Kedai Nasi Lemak Warisan', category:'Street Food', state:'Selangor', city:'Kuala Lumpur', rating:4.6, photos:['/images/business-default.jpg','/images/hero-banner.jpg'], address:'No 12, Jalan Heritage, KL', description:'Traditional nasi lemak served with family sambal recipe.'},
      {id:'b2', name:'Melaka Satay House', category:'Grill', state:'Melaka', city:'Melaka City', rating:4.4, photos:['/images/business-default.jpg'], address:'Lot 5, Jonker Street', description:'Famous local satay using charcoal grill.'}
    ];

    const resultsEl = document.getElementById('results');
    const categoryFilter = document.getElementById('categoryFilter');
    const stateFilter = document.getElementById('stateFilter');
    const cityFilter = document.getElementById('cityFilter');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearFilters');
    const noResultsEl = document.getElementById('noResults');

    let businesses = sampleData.slice();

    function uniqueValues(list,key){ return [...new Set(list.map(i=>i[key]||'').filter(Boolean))].sort(); }

    function populateFilters(){
      const cats = uniqueValues(businesses,'category');
      const states = uniqueValues(businesses,'state');
      const cities = uniqueValues(businesses,'city');
      cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; categoryFilter.appendChild(o); });
      states.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; stateFilter.appendChild(o); });
      cities.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cityFilter.appendChild(o); });
    }

    function renderCards(list){
      resultsEl.innerHTML='';
      if(!list || list.length===0){ noResultsEl.hidden = false; return; }
      noResultsEl.hidden = true;
      list.forEach(b=>{
        const card = document.createElement('article'); card.className='card';
        const thumb = document.createElement('div'); thumb.className='thumb';
        const img = document.createElement('img'); img.alt = b.name + ' photo'; img.src = b.photos && b.photos.length ? b.photos[0] : '/images/business-default.jpg';
        thumb.appendChild(img);

        const title = document.createElement('h3'); title.textContent = b.name;
        const meta = document.createElement('div'); meta.className='meta'; meta.textContent = `${b.category} • ${b.city}, ${b.state} • ★ ${b.rating}`;
        const desc = document.createElement('div'); desc.className='desc'; desc.textContent = b.description || '';

        const actions = document.createElement('div'); actions.className='card-actions';
        const detailsLink = document.createElement('a'); detailsLink.href = '/business/' + encodeURIComponent(b.id); detailsLink.className='link-btn'; detailsLink.textContent='View Details';
        const galleryBtn = document.createElement('button'); galleryBtn.className='link-btn'; galleryBtn.type='button'; galleryBtn.textContent='View Gallery';
        galleryBtn.addEventListener('click', ()=>{ openGallery(b.photos || []); });

        actions.appendChild(detailsLink); actions.appendChild(galleryBtn);

        card.appendChild(thumb);
        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(desc);
        card.appendChild(actions);
        resultsEl.appendChild(card);
      });
    }

    // simple gallery (modal) --- keep minimal
    function openGallery(photos){ if(!photos || photos.length===0){ alert('No photos available'); return; } alert('Gallery open — implement later or use details page for full gallery'); }

    function applyFilters(){
      const q = (searchInput.value || '').trim().toLowerCase();
      const cat = categoryFilter.value; const st = stateFilter.value; const ct = cityFilter.value;
      let list = businesses.filter(b=> b.name.toLowerCase().includes(q));
      if(cat) list = list.filter(b=> b.category === cat);
      if(st) list = list.filter(b=> b.state === st);
      if(ct) list = list.filter(b=> b.city === ct);
      renderCards(list);
    }

    searchBtn.addEventListener('click', applyFilters);
    searchInput.addEventListener('keyup', e=>{ if(e.key==='Enter') applyFilters(); });
    categoryFilter.addEventListener('change', applyFilters);
    stateFilter.addEventListener('change', ()=>{ populateCityOptions(); applyFilters(); });
    cityFilter.addEventListener('change', applyFilters);
    clearBtn.addEventListener('click', ()=>{ categoryFilter.value=''; stateFilter.value=''; cityFilter.value=''; searchInput.value=''; populateCityOptions(); renderCards(businesses); });

    function populateCityOptions(){ const selectedState = stateFilter.value; const cities = selectedState ? uniqueValues(businesses.filter(b=>b.state===selectedState),'city') : uniqueValues(businesses,'city'); cityFilter.innerHTML = '<option value="">All Cities</option>'; cities.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cityFilter.appendChild(o); }); }

    // init
    window.addEventListener('DOMContentLoaded', ()=>{ if(window.__BUSINESSES__ && Array.isArray(window.__BUSINESSES__)) businesses = window.__BUSINESSES__; populateFilters(); populateCityOptions(); renderCards(businesses); });
  })();
  </script>
</body>
</html>
