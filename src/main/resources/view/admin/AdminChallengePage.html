<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/fragments :: head('WarisanGo — Admin')}"></th:block>
  <link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}">
</head>
<body>
  <div th:replace="~{fragments/fragments :: navbar('admin')}"></div>
<div id="page-admin" class="page active">
<main>
  <div id="admin-success" style="display:none" class="success-banner">
    <span id="admin-success-msg"></span>
    <button onclick="document.getElementById('admin-success').style.display='none'" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer">×</button>
  </div>

  <!-- Delete modal -->
  <div id="delete-modal" style="display:none" class="modal-overlay">
    <div class="modal-box" style="border:2px solid #c9a84c">
      <h3 style="font-family:'Fraunces',Georgia,serif;font-size:22px;margin-bottom:12px">Delete Challenge?</h3>
      <p style="font-size:13px;color:#6b6b68;margin-bottom:24px">Are you sure you want to delete <strong id="delete-name" style="color:#141413"></strong>? This cannot be undone.</p>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="confirmDelete()">Delete</button>
        <button class="btn-secondary" onclick="document.getElementById('delete-modal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px">
    <h1 id="admin-title">Challenge Management</h1>
    <button class="btn-primary" id="admin-create-btn" onclick="openAdminCreate()" style="margin-top:8px">+ Create New Challenge</button>
  </div>
  <div class="batik-divider" style="margin-bottom:32px"></div>

  <!-- List view -->
  <div id="admin-list">
    <div style="border:1px solid #e8e6e0;border-radius:12px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr 80px 130px 110px 130px;padding:10px 20px;background:#141413;color:#fff;font-size:11px;font-family:'Inter',monospace;letter-spacing:0.06em">
        <span>CHALLENGE</span><span>POINTS</span><span>BADGE</span><span>EXPIRES</span><span style="text-align:right">ACTIONS</span>
      </div>
      <div id="admin-rows"></div>
    </div>
  </div>

  <!-- Form view -->
  <div id="admin-form" style="display:none;max-width:600px;padding:32px;border:1px solid #e8e6e0;border-radius:12px;background:#ffffff">
    <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Challenge Title *</label><input id="f-title" type="text" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413"/><div id="e-title" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
    <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Description *</label><textarea id="f-desc" rows="3" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413;resize:vertical"></textarea><div id="e-desc" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
    <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Requirements *</label><textarea id="f-req" rows="3" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413;resize:vertical"></textarea><div id="e-req" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px">
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Target Check-ins *</label><input id="f-target" type="number" min="1" value="1" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413"/><div id="e-target" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Bonus Points *</label><input id="f-pts" type="number" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413"/><div id="e-pts" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
      <div><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Exclusive Badge Name *</label><input id="f-badge" type="text" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413"/><div id="e-badge" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
    </div>
    <div style="margin-bottom:18px"><label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">Expiry Date *</label><input id="f-date" type="date" style="width:100%;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #e8e6e0;background:#faf9f5;color:#141413"/><div id="e-date" style="font-size:12px;color:#c9a84c;margin-top:4px;font-weight:600;display:none"></div></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn-primary" id="form-save-btn" onclick="saveAdminForm()">Publish Challenge</button>
      <button class="btn-secondary" onclick="closeAdminForm()">Cancel</button>
    </div>
  </div>
</main>
</div>
<script>
let adminChallenges = [];
let adminMode = 'list';
let editingId = null;
let deleteTargetId = null;

async function loadAdminChallenges() {
  try {
    const r = await fetch('/api/admin/challenges');
    if (!r.ok) throw new Error('Unable to load challenges');
    adminChallenges = await r.json();
    renderAdminRows();
  } catch(e) {
    console.error(e);
    document.getElementById('admin-rows').innerHTML = '<div style="padding:48px;text-align:center;color:#6b6b68">Unable to load challenges from Firebase.</div>';
  }
}

function renderAdminRows() {
  const container = document.getElementById('admin-rows');
  if (!adminChallenges.length) { container.innerHTML='<div style="padding:48px;text-align:center;color:#6b6b68">No challenges yet. Create your first challenge.</div>'; return; }
  container.innerHTML = adminChallenges.map((ch,i)=>{
    const expired = ch.expiry && new Date(ch.expiry) < new Date();
    return `<div style="display:grid;grid-template-columns:1fr 80px 130px 110px 130px;padding:14px 20px;border-bottom:${i<adminChallenges.length-1?'1px solid #e8e6e0':'none'};background:${expired?'#f5e9c4':i%2===0?'#faf9f5':'#fff'};align-items:center">
      <div><div style="font-size:13px;font-weight:600;margin-bottom:2px">${escapeHtml(ch.title||'')}</div><div style="font-size:12px;color:#6b6b68;line-height:1.4">${escapeHtml(ch.description||'')}</div></div>
      <div style="font-family:'Inter',monospace;font-size:13px;font-weight:700;color:#c9a84c">+${Number(ch.rewardPoints||0)}</div>
      <div style="font-size:12px;color:#6b6b68">${escapeHtml(ch.badge||'')}</div>
      <div style="font-size:12px;font-family:'Inter',monospace">${escapeHtml(ch.expiry||'—')}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button onclick="openAdminEdit('${escapeJs(ch.id)}')" style="padding:5px 12px;background:transparent;color:#141413;border:1px solid #e8e6e0;border-radius:8px;font-size:12px;cursor:pointer">Edit</button><button onclick="openDeleteModal('${escapeJs(ch.id)}','${escapeJs(ch.title||'Challenge')}')" style="padding:5px 12px;background:#c9a84c;color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer">Delete</button></div>
    </div>`;
  }).join('');
}

function openAdminCreate() {
  adminMode='create'; editingId=null;
  document.getElementById('admin-title').textContent='Create New Challenge';
  document.getElementById('admin-create-btn').style.display='none'; document.getElementById('admin-list').style.display='none'; document.getElementById('admin-form').style.display='block'; document.getElementById('form-save-btn').textContent='Publish Challenge';
  ['title','desc','req','pts','badge','date'].forEach(k=>{document.getElementById('f-'+k).value='';}); document.getElementById('f-target').value='1';
}

function openAdminEdit(id) {
  const ch=adminChallenges.find(c=>c.id===id); if(!ch)return;
  adminMode='edit'; editingId=id;
  document.getElementById('admin-title').textContent='Edit: '+ch.title; document.getElementById('admin-create-btn').style.display='none'; document.getElementById('admin-list').style.display='none'; document.getElementById('admin-form').style.display='block'; document.getElementById('form-save-btn').textContent='Save Changes';
  document.getElementById('f-title').value=ch.title||''; document.getElementById('f-desc').value=ch.description||''; document.getElementById('f-req').value=ch.requirement||''; document.getElementById('f-target').value=ch.target||1; document.getElementById('f-pts').value=ch.rewardPoints||0; document.getElementById('f-badge').value=ch.badge||''; document.getElementById('f-date').value=ch.expiry||'';
}

function closeAdminForm(){adminMode='list';document.getElementById('admin-title').textContent='Challenge Management';document.getElementById('admin-create-btn').style.display='block';document.getElementById('admin-list').style.display='block';document.getElementById('admin-form').style.display='none';}

async function saveAdminForm(){
  const body={title:document.getElementById('f-title').value.trim(),description:document.getElementById('f-desc').value.trim(),requirement:document.getElementById('f-req').value.trim(),target:Number(document.getElementById('f-target').value),rewardPoints:Number(document.getElementById('f-pts').value),badge:document.getElementById('f-badge').value.trim(),expiry:document.getElementById('f-date').value,status:'ACTIVE'};
  if(!body.title||!body.description||!body.requirement||body.target<1||body.rewardPoints<1||!body.badge||!body.expiry){alert('Please complete all fields with valid values.');return;}
  const url=adminMode==='create'?'/api/admin/challenges':`/api/admin/challenges/${encodeURIComponent(editingId)}`;
  const r=await fetch(url,{method:adminMode==='create'?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){alert('Unable to save challenge.');return;}
  closeAdminForm(); await loadAdminChallenges(); showAdminSuccess(`Challenge "${body.title}" ${adminMode==='create'?'published':'updated'}.`);
}

function openDeleteModal(id,title){deleteTargetId=id;document.getElementById('delete-name').textContent='"'+title+'"';document.getElementById('delete-modal').style.display='flex';}
async function confirmDelete(){
  const r=await fetch(`/api/admin/challenges/${encodeURIComponent(deleteTargetId)}`,{method:'DELETE'}); document.getElementById('delete-modal').style.display='none';
  if(!r.ok){alert('Unable to delete challenge.');return;} await loadAdminChallenges(); showAdminSuccess('Challenge deleted.');
}
function showAdminSuccess(msg){document.getElementById('admin-success-msg').textContent='✓ '+msg;document.getElementById('admin-success').style.display='flex';}
function escapeJs(value) {
  return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
loadAdminChallenges();
</script>
  <div th:replace="~{fragments/footer :: global}"></div>
</body>
</html>
