<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/fragments :: head('Business Reports — WarisanGo Admin')}"></th:block>
  <link rel="stylesheet" href="/css/business-reports.css" th:href="@{/css/business-reports.css}">
</head>
<body>
<div th:replace="~{fragments/fragments :: navbar('business-reports')}"></div>
<main class="report-admin-page">
  <header class="report-page-header">
    <p>Admin · Module 8</p>
    <h1>Business Reports</h1>
  </header>
  <section class="report-summary-grid" aria-label="Report summary">
    <article><strong th:text="${totalReports}">0</strong><span>Total Reports</span></article>
    <article class="pending"><strong th:text="${pendingReports}">0</strong><span>Pending</span></article>
    <article class="resolved"><strong th:text="${resolvedReports}">0</strong><span>Resolved</span></article>
    <article class="dismissed"><strong th:text="${dismissedReports}">0</strong><span>Dismissed</span></article>
  </section>
  <section class="report-table-card" aria-labelledby="report-queue-title">
    <h2 id="report-queue-title" class="sr-only">Report review queue</h2>
    <div class="report-table-header">
      <span>Business</span><span>Reported By</span><span>Reason</span><span>Status</span><span>Action</span>
    </div>
    <p class="report-empty" th:if="${#lists.isEmpty(reports)}">No business reports have been submitted.</p>
    <a class="report-table-row" th:each="report : ${reports}"
       th:href="@{/admin/business-reports/{id}(id=${report.reportId})}">
      <span><strong th:text="${report.reportedBusiness != null ? report.reportedBusiness.name : report.businessId}">Business</strong><small th:text="${report.businessId}">ID</small></span>
      <span><strong th:text="${report.touristName != null ? report.touristName : 'Tourist'}">Tourist</strong><small th:text="${report.touristId}">UID</small></span>
      <span th:text="${#strings.replace(report.reason, '_', ' ')}">Reason</span>
      <span><em class="report-status" th:classappend="${#strings.toLowerCase(report.status)}" th:text="${#strings.replace(report.status, '_', ' ')}">Status</em></span>
      <span class="report-view">View</span>
    </a>
  </section>
</main>
<div th:replace="~{fragments/footer :: global}"></div>
</body>
</html>
