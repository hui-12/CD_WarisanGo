<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|WarisanGo - ${business.name ?: 'Pending Business'}|">WarisanGo - Pending Business</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin/pending-list.css}">
</head>

<body>

<header th:replace="~{admin/fragments/navigation :: navigation('pending')}"></header>

<main class="container py-4">

    <a class="back-link" th:href="@{/admin/pending-list}">← Back to Pending List</a>

    <div class="detail-heading">
        <div>
            <span class="status-badge" th:text="${business.status}">Pending</span>
            <h1 th:text="${business.name ?: 'Unnamed heritage business'}">Business name</h1>
            <p th:text="${business.businessId}">hb_001</p>
        </div>

        <div class="review-actions">
            <form th:action="@{/admin/pending-list/{id}/reject(id=${business.businessId})}"
                  method="post">
                <button class="btn btn-outline-danger review-button" type="submit">
                    Reject Business
                </button>
            </form>
            <form th:action="@{/admin/pending-list/{id}/approve(id=${business.businessId})}"
                  method="post">
                <button class="btn btn-success review-button" type="submit">
                    Approve Business
                </button>
            </form>
        </div>
    </div>

    <section class="detail-card" aria-labelledby="business-information-heading">
        <h2 id="business-information-heading">Business Information</h2>

        <dl class="detail-grid">
            <div class="detail-item detail-item-wide">
                <dt>Description</dt>
                <dd th:text="${business.description ?: 'Not available'}">Description</dd>
            </div>
            <div class="detail-item">
                <dt>Address</dt>
                <dd th:text="${business.address ?: 'Not available'}">Address</dd>
            </div>
            <div class="detail-item">
                <dt>City</dt>
                <dd th:text="${business.city ?: 'Not available'}">City</dd>
            </div>
            <div class="detail-item">
                <dt>Coordinates</dt>
                <dd th:if="${business.latitude != null and business.longitude != null}"
                    th:text="|${business.latitude}, ${business.longitude}|">Coordinates</dd>
                <dd th:unless="${business.latitude != null and business.longitude != null}">Not available</dd>
            </div>
            <div class="detail-item">
                <dt>Average Rating</dt>
                <dd th:text="${business.averageRating != null ? business.averageRating : 'Not rated'}">Not rated</dd>
            </div>
            <div class="detail-item detail-item-wide">
                <dt>Source Video</dt>
                <dd th:if="${business.sourceVideoLink != null}">
                    <a th:href="${business.sourceVideoLink}"
                       target="_blank"
                       rel="noopener noreferrer"
                       th:text="${business.sourceVideoLink}">Source video</a>
                </dd>
                <dd th:unless="${business.sourceVideoLink != null}">Not available</dd>
            </div>
        </dl>
    </section>

</main>

</body>

</html>
