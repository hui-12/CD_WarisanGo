<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/fragments :: head('WarisanGo — Admin')}"></th:block>
    <link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/fragments :: navbar('admin-challenges')}"></div>
    <div id="page-admin" class="page active">
      <main class="admin-management-page">
        <div id="admin-success" class="view-admin-challenge-1 success-banner">
          <span id="admin-success-msg"></span>
          <button id="close-admin-success" class="view-admin-challenge-2" type="button">×</button>
        </div>

        <!-- Delete modal -->
        <div id="delete-modal" class="view-admin-challenge-3 modal-overlay">
          <div class="modal-box view-admin-challenge-4">
            <h3 class="view-admin-challenge-5">Delete Challenge?</h3>
            <p class="view-admin-challenge-6">
              Are you sure you want to delete <strong id="delete-name" class="view-admin-challenge-7"></strong>? This
              cannot be undone.
            </p>
            <div class="view-admin-challenge-8">
              <button class="btn-primary" id="confirm-challenge-delete" type="button">Delete</button>
              <button class="btn-secondary" id="cancel-challenge-delete" type="button">Cancel</button>
            </div>
          </div>
        </div>

        <div class="view-admin-challenge-9 admin-management-header">
          <div>
            <p class="admin-management-kicker">Rewards configuration</p>
            <h1 id="admin-title">Challenge Management</h1>
            <p class="admin-management-description">Create and maintain tourist challenges and their rewards.</p>
          </div>
          <button class="btn-primary view-admin-challenge-10" id="admin-create-btn" type="button">
            + Create New Challenge
          </button>
        </div>
        <div class="batik-divider view-admin-challenge-11"></div>

        <!-- List view -->
        <div id="admin-list">
          <div class="view-admin-challenge-12">
            <div class="view-admin-challenge-13">
              <span>CHALLENGE</span><span>POINTS</span><span>BADGE</span><span>EXPIRES</span
              ><span class="view-admin-challenge-14">ACTIONS</span>
            </div>
            <div id="admin-rows"></div>
          </div>
        </div>

        <!-- Form view -->
        <div id="admin-form" class="view-admin-challenge-15">
          <div class="view-admin-challenge-16">
            <label class="view-admin-challenge-17">Challenge Title *</label
            ><input id="f-title" type="text" class="view-admin-challenge-18" />
            <div id="e-title" class="view-admin-challenge-19"></div>
          </div>
          <div class="view-admin-challenge-20">
            <label class="view-admin-challenge-21">Description *</label
            ><textarea id="f-desc" rows="3" class="view-admin-challenge-22"></textarea>
            <div id="e-desc" class="view-admin-challenge-23"></div>
          </div>
          <div class="view-admin-challenge-24">
            <label class="view-admin-challenge-25">Requirements *</label
            ><textarea id="f-req" rows="3" class="view-admin-challenge-26"></textarea>
            <div id="e-req" class="view-admin-challenge-27"></div>
          </div>
          <div class="view-admin-challenge-28">
            <div>
              <label class="view-admin-challenge-29">Target Check-ins *</label
              ><input id="f-target" type="number" min="1" value="1" class="view-admin-challenge-30" />
              <div id="e-target" class="view-admin-challenge-31"></div>
            </div>
            <div>
              <label class="view-admin-challenge-32">Bonus Points *</label
              ><input id="f-pts" type="number" class="view-admin-challenge-33" />
              <div id="e-pts" class="view-admin-challenge-34"></div>
            </div>
            <div>
              <label class="view-admin-challenge-35">Exclusive Badge Name *</label
              ><input id="f-badge" type="text" class="view-admin-challenge-36" />
              <div id="e-badge" class="view-admin-challenge-37"></div>
            </div>
          </div>
          <div class="view-admin-challenge-38">
            <div>
              <label class="view-admin-challenge-39">Expiry Date *</label
              ><input id="f-date" type="date" class="view-admin-challenge-40" />
              <div id="e-date" class="view-admin-challenge-41"></div>
            </div>
            <div>
              <label class="view-admin-challenge-42">Status *</label
              ><select id="f-status" class="view-admin-challenge-43">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
          </div>
          <div class="view-admin-challenge-44">
            <button class="btn-primary" id="form-save-btn" type="button">Publish Challenge</button>
            <button class="btn-secondary" id="cancel-admin-form" type="button">Cancel</button>
          </div>
        </div>
      </main>
    </div>
    <div th:replace="~{fragments/footer :: global}"></div>
    <script src="/js/admin-challenges.js" th:src="@{/js/admin-challenges.js}" defer></script>
  </body>
</html>
