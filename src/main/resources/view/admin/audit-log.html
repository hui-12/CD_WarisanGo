<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarisanGo - Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin/audit-log.css}">
</head>

<body>

<header th:replace="~{admin/fragments/navigation :: navigation('audit')}"></header>

<main class="container py-4">

    <div class="audit-heading">
        <div>
            <h1>Audit Log</h1>
            <p>Businesses that have been approved or rejected by an administrator.</p>
        </div>
        <span class="entry-count" th:text="|${#lists.size(entries)} records|">0 records</span>
    </div>

    <section class="audit-card" aria-labelledby="audit-records-heading">
        <h2 id="audit-records-heading" class="visually-hidden">Business review records</h2>

        <div class="empty-state" th:if="${#lists.isEmpty(entries)}">
            <h3>No audit records</h3>
            <p>Approved and rejected businesses will appear here.</p>
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(entries)}">
            <table class="table audit-table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">Business</th>
                    <th scope="col">Address</th>
                    <th scope="col">Decision</th>
                    <th scope="col">Decision Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${entries}">
                    <td>
                        <strong th:text="${entry.businessName ?: 'Unnamed heritage business'}">Business name</strong>
                        <span class="business-id" th:text="${entry.businessId}">hb_001</span>
                    </td>
                    <td th:text="${entry.address ?: 'Not available'}">Address</td>
                    <td>
                        <span class="decision-badge"
                              th:classappend="${entry.status == 'Approved'} ? 'approved' : 'rejected'"
                              th:text="${entry.status}">
                            Approved
                        </span>
                    </td>
                    <td>
                        <time th:datetime="${entry.reviewedAt}"
                              th:text="${entry.reviewedAtDisplay}">
                            Time not recorded
                        </time>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>

</html>
