<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${business.name} + ' — Details'">Business Details</title>
  <style>
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#f5f7fb;color:#222;margin:0}
    .container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:8px}
    .gallery img{max-width:100%;height:auto;border-radius:6px;margin-bottom:8px}
    .back{display:inline-block;margin-bottom:12px}
    .meta{color:#666;margin-bottom:8px}
    .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
    .photos img{width:100%;height:160px;object-fit:cover;border-radius:6px}
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← Back to directory</a>

    <h1 th:text="${business.name}">Business Name</h1>
    <div class="meta" th:text="${business.category} + ' • ' + ${business.city} + ', ' + ${business.state} + ' • ★ ' + ${business.rating}"></div>
    <p th:text="${business.address}"></p>
    <p th:text="${business.description}"></p>

    <section class="gallery">
      <h3>Photos</h3>
      <div th:if="${business.photos == null or #lists.isEmpty(business.photos)}">No photos available for this business.</div>
      <div class="photos" th:if="${business.photos != null}">
        <img th:each="p : ${business.photos}" th:src="${p}" th:alt="${business.name} + ' photo'" />
      </div>
    </section>
  </div>
</body>
</html>
