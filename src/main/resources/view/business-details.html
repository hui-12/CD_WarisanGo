<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${business.name} + ' — WarisanGo'">Business Details</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--muted:#6b7280;--accent:#1f6feb}
    body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#0f172a;margin:0}
    .container{max-width:1000px;margin:24px auto;padding:20px}
    .card{background:var(--card);padding:20px;border-radius:12px;border:1px solid #e6e9ef}
    .hero{display:grid;grid-template-columns:1fr 320px;gap:18px}
    .hero img{width:100%;height:360px;object-fit:cover;border-radius:10px}
    .info h1{margin:0 0 8px 0}
    .meta{color:var(--muted);margin-bottom:12px}
    .address{margin-bottom:12px}
    .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
    .photos img{width:100%;height:140px;object-fit:cover;border-radius:8px}
    .back{display:inline-block;margin-bottom:12px;text-decoration:none;color:var(--accent)}
    @media (max-width:800px){ .hero{grid-template-columns:1fr} .hero img{height:220px} }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← Back to directory</a>

    <div class="card">
      <div class="hero">
        <div>
          <img th:src="${business.photos[0]}" th:alt="${business.name} + ' photo'" src="/images/business-default.jpg"/>
        </div>
        <aside class="info">
          <h1 th:text="${business.name}">Business Name</h1>
          <div class="meta" th:text="${business.category} + ' • ' + ${business.city} + ', ' + ${business.state} + ' • ★ ' + ${business.rating}"></div>
          <div class="address" th:text="${business.address}"></div>
          <div>
            <a th:href="@{'/'}" class="link">Back</a>
          </div>
        </aside>
      </div>

      <section style="margin-top:16px">
        <h3>Description</h3>
        <p th:text="${business.description}">Business description</p>
      </section>

      <section style="margin-top:16px" id="photos">
        <h3>Photos</h3>
        <div th:if="${business.photos == null or #lists.isEmpty(business.photos)}">No photos available for this business.</div>
        <div class="photos" th:if="${business.photos != null}">
          <img th:each="p : ${business.photos}" th:src="${p}" th:alt="${business.name} + ' photo'" />
        </div>
      </section>
    </div>
  </div>
</body>
</html>
