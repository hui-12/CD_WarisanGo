<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">WarisanGo</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Styles (With static href fallback) -->
    <link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
</head>
<body>
    <!-- Sticky Navbar Fragment -->
    <header th:fragment="navbar(activePage)" class="navbar">
        <div class="nav-container">
            <button type="button" class="brand-logo" data-navigate="home">
                <span class="brand-main">Warisan</span><span class="brand-accent">Go</span>
                <span th:if="${currentUser != null and #strings.equalsIgnoreCase(currentUser.role, 'ADMIN')}"
                      class="admin-badge">ADMIN MODE</span>
            </button>

            <nav class="nav-links" id="nav-menu">
                <button type="button" class="nav-item" th:classappend="${activePage == 'home'} ? ' active'" data-navigate="home">Home</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'directory'} ? ' active'" data-navigate="directory">Directory</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'map'} ? ' active'" data-navigate="map">Map</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'rewards'} ? ' active'" data-navigate="rewards">Rewards</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'badges'} ? ' active'" data-navigate="badges">Badges</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'challenges'} ? ' active'" data-navigate="challenges">Challenges</button>
                <button type="button" class="nav-item" th:classappend="${activePage == 'profile'} ? ' active'" data-navigate="profile">Profile</button>
            </nav>

            <div class="nav-actions">
                <button th:if="${currentUser != null and #strings.equalsIgnoreCase(currentUser.role, 'ADMIN')}"
                        type="button" class="btn-role-switch admin-workspace" data-navigate="admin">Admin workspace</button>
                <button type="button" class="user-profile-btn" data-navigate="profile">
                    <img th:src="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isBlank() ? currentUser.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop'}"
                         alt="User avatar" class="avatar-img">
                    <span class="user-name" th:text="${currentUser != null ? currentUser.name : 'WarisanGo visitor'}">WarisanGo visitor</span>
                </button>
            </div>
        </div>
    </header>
</body>
</html>
