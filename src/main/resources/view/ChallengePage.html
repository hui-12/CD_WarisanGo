<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/fragments :: head('WarisanGo — Challenges')}"></th:block>
  <link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}">
</head>
<body>
  <div th:replace="~{fragments/fragments :: navbar('challenges')}"></div>
<div id="page-challenges" class="page active">
<main>
  <h1>Active Challenges</h1>
  <p class="muted">Join limited-time challenges to earn bonus points and exclusive badges before they expire.</p>
  <div class="batik-divider" style="margin:24px 0"></div>
  <div id="challenges-list" style="display:flex;flex-direction:column;gap:12px"></div>
  <!-- Completion modal -->
  <div id="complete-modal" style="display:none" class="modal-overlay">
    <div class="batik-bg modal-box" style="text-align:center;border:2px solid #2d7a4f">
      <div style="font-size:52px;margin-bottom:16px">🎉</div>
      <h2 style="font-family:'Fraunces',Georgia,serif;font-size:26px;margin-bottom:12px">Challenge Complete!</h2>
      <p style="font-size:14px;color:#6b6b68;margin-bottom:20px">You completed <strong id="done-title" style="color:#141413"></strong> and earned:</p>
      <div style="display:flex;justify-content:center;gap:32px;margin-bottom:28px">
        <div><div id="done-pts" style="font-family:'Inter',monospace;font-size:26px;font-weight:700;color:#c9a84c"></div><div style="font-size:12px;color:#6b6b68">bonus points</div></div>
        <div><div id="done-badge" style="font-size:28px"></div><div style="font-size:12px;color:#6b6b68">exclusive badge</div></div>
      </div>
      <button class="btn-primary" onclick="document.getElementById('complete-modal').style.display='none'">Awesome!</button>
    </div>
  </div>
</main>
</div>
<script>
// ══════════════════════════════════════
// PAGE 4: CHALLENGES (Tourist)
// ══════════════════════════════════════
let challenges = [
  { id:1, title:'Weekend Foodie Sprint',  desc:'Visit 3 heritage businesses this weekend.',          req:'Check in at 3 different heritage food businesses between Fri–Sun.', pts:150, badge:'🌟 Weekend Warrior', expiry:'3 Aug 2026',  days:4,  joined:true,  done:false, progress:2, total:3 },
  { id:2, title:'Penang Pilgrimage',       desc:"Explore 5 heritage businesses in Penang's George Town.", req:'Check in at 5 businesses located in Penang.',               pts:300, badge:'🦁 Penang Pride',   expiry:'15 Aug 2026', days:16, joined:false, done:false, progress:0, total:5 },
  { id:3, title:'Noodle Nomad',            desc:'Try 4 different noodle-based heritage dishes.',       req:'Check in at 4 businesses tagged with noodle dishes.',           pts:200, badge:'🍜 Noodle Nomad',   expiry:'10 Aug 2026', days:11, joined:false, done:false, progress:0, total:4 },
];

function renderChallenges() {
  document.getElementById('challenges-list').innerHTML = challenges.map(ch => {
    const pct    = (ch.progress / ch.total) * 100;
    const urgent = ch.days <= 3;
    const bg     = ch.done ? '#2d7a4f' : '#faf9f5';
    const col    = ch.done ? '#fff' : '#141413';
    return `<div class="${ch.done ? 'batik-bg' : ''}" style="padding:24px;border-radius:12px;
      border:${ch.done ? '1.5px solid #2d7a4f' : urgent ? '1.5px solid #c9a84c' : '1px solid #e8e6e0'};
      background:${bg};color:${col};display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
          <span style="font-size:16px;font-weight:700">${ch.title}</span>
          ${urgent && !ch.done ? '<span style="font-size:9px;font-family:\'Inter\',monospace;letter-spacing:0.07em;color:#fff;background:#c9a84c;border-radius:4px;padding:2px 8px">EXPIRING SOON</span>' : ''}
          ${ch.done ? '<span style="font-size:9px;font-family:\'Inter\',monospace;letter-spacing:0.07em;color:rgba(255,255,255,0.45)">COMPLETED</span>' : ''}
        </div>
        <p style="font-size:13px;opacity:0.75;margin-bottom:12px;line-height:1.55">${ch.desc}</p>
        <div style="font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:16px;line-height:1.55;
          background:${ch.done ? 'rgba(255,255,255,0.08)' : '#f5e9c4'};color:${ch.done ? 'rgba(255,255,255,0.7)' : '#6b6b68'}">
          <strong style="color:${ch.done ? 'rgba(255,255,255,0.9)' : '#141413'}">Requirements:</strong> ${ch.req}
        </div>
        ${ch.joined ? `
          <div style="height:5px;background:${ch.done ? 'rgba(255,255,255,0.15)' : '#f5e9c4'};border-radius:4px;margin-bottom:6px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${ch.done ? 'rgba(255,255,255,0.6)' : '#c9a84c'};border-radius:4px;transition:width 0.4s"></div>
          </div>
          <div style="font-size:11px;font-family:'Inter',monospace;color:${ch.done ? 'rgba(255,255,255,0.45)' : '#6b6b68'}">${ch.progress} / ${ch.total} requirements met</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:160px">
        <div style="text-align:right">
          <div style="font-family:'Inter',monospace;font-size:20px;font-weight:700;color:${ch.done ? 'rgba(255,255,255,0.85)' : '#c9a84c'}">+${ch.pts} pts</div>
          <div style="font-size:12px;opacity:0.7;margin-bottom:4px">${ch.badge}</div>
          <div style="font-size:11px;font-family:'Inter',monospace;color:${urgent && !ch.done ? '#c9a84c' : ch.done ? 'rgba(255,255,255,0.4)' : '#6b6b68'};font-weight:${urgent && !ch.done ? 700 : 400}">Expires ${ch.expiry}</div>
          <div style="font-size:11px;color:${urgent && !ch.done ? '#c9a84c' : ch.done ? 'rgba(255,255,255,0.4)' : '#6b6b68'}">${ch.days} days left</div>
        </div>
        ${!ch.joined ? `<button class="btn-primary" style="width:100%" onclick="joinChallenge(${ch.id})">Join Challenge</button>` : ''}
        ${ch.joined && !ch.done ? `<button class="btn-secondary" style="width:100%" onclick="progressChallenge(${ch.id})">Simulate Visit +1</button>` : ''}
        ${ch.done ? `<div style="font-size:12px;color:rgba(255,255,255,0.45);font-family:'Inter',monospace">✓ DONE</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function joinChallenge(id) {
  challenges = challenges.map(c => c.id === id ? {...c, joined:true} : c);
  renderChallenges();
}

function progressChallenge(id) {
  challenges = challenges.map(c => {
    if (c.id !== id) return c;
    const np = Math.min(c.progress + 1, c.total);
    const done = np >= c.total;
    if (done) {
      const ch = challenges.find(x => x.id === id);
      document.getElementById('done-title').textContent = ch.title;
      document.getElementById('done-pts').textContent = '+' + ch.pts;
      document.getElementById('done-badge').textContent = ch.badge.split(' ')[0];
      document.getElementById('complete-modal').style.display = 'flex';
    }
    return {...c, progress:np, done};
  });
  renderChallenges();
}

// ── Init ──────────────────────────────────────────────────────
renderChallenges();
</script>
  <div th:replace="~{fragments/footer :: global}"></div>
</body>
</html>
