<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WarisanGo — Challenges</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}"/>
</head>
<body>
<!-- NAV -->
<header id="site-header">
  <div class="nav-inner">
    <div class="wordmark">
      <span style="font-size:20px">🍛</span>
      <span class="wordmark-text">WarisanGo</span>
      <span class="wordmark-badge">REWARDS</span>
    </div>
    <nav class="nav-links" id="nav-menu">
      <button type="button" class="nav-btn" th:classappend="${activePage == 'checkin'} ? ' active'" data-navigate="checkin">Check In</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'badges'} ? ' active'" data-navigate="badges">Badges</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'rewards'} ? ' active'" data-navigate="rewards">Rewards</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'challenges'} ? ' active'" data-navigate="challenges">Challenges</button>
      <button type="button" class="nav-btn admin-btn" th:classappend="${activePage == 'admin'} ? ' active'" data-navigate="admin">Admin</button>
    </nav>
  </div>
  <div class="batik-divider" style="opacity:0.5"></div>
</header>

<div id="page-challenges" class="page active">
<main>
  <h1>Active Challenges</h1>
  <p class="muted">Join limited-time challenges to earn bonus points and exclusive badges before they expire.</p>
  <div class="batik-divider" style="margin:24px 0"></div>
  <div id="challenges-list" style="display:flex;flex-direction:column;gap:12px"></div>
  <!-- Completion modal -->
  <div id="complete-modal" style="display:none" class="modal-overlay">
    <div class="batik-bg modal-box" style="text-align:center;border:2px solid #1E5C3A">
      <div style="font-size:52px;margin-bottom:16px">🎉</div>
      <h2 style="font-family:'DM Serif Display',Georgia,serif;font-size:26px;margin-bottom:12px">Challenge Complete!</h2>
      <p style="font-size:14px;color:#8A7D6E;margin-bottom:20px">You completed <strong id="done-title" style="color:#2A2118"></strong> and earned:</p>
      <div style="display:flex;justify-content:center;gap:32px;margin-bottom:28px">
        <div><div id="done-pts" style="font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:#D98A2E"></div><div style="font-size:12px;color:#8A7D6E">bonus points</div></div>
        <div><div id="done-badge" style="font-size:28px"></div><div style="font-size:12px;color:#8A7D6E">exclusive badge</div></div>
      </div>
      <button class="btn-primary" onclick="document.getElementById('complete-modal').style.display='none'">Awesome!</button>
    </div>
  </div>
</main>
</div>
<script>
// ══════════════════════════════════════
// PAGE 4: CHALLENGES (Tourist)
// ══════════════════════════════════════
let challenges = [
  { id:1, title:'Weekend Foodie Sprint',  desc:'Visit 3 heritage businesses this weekend.',          req:'Check in at 3 different heritage food businesses between Fri–Sun.', pts:150, badge:'🌟 Weekend Warrior', expiry:'3 Aug 2026',  days:4,  joined:true,  done:false, progress:2, total:3 },
  { id:2, title:'Penang Pilgrimage',       desc:"Explore 5 heritage businesses in Penang's George Town.", req:'Check in at 5 businesses located in Penang.',               pts:300, badge:'🦁 Penang Pride',   expiry:'15 Aug 2026', days:16, joined:false, done:false, progress:0, total:5 },
  { id:3, title:'Noodle Nomad',            desc:'Try 4 different noodle-based heritage dishes.',       req:'Check in at 4 businesses tagged with noodle dishes.',           pts:200, badge:'🍜 Noodle Nomad',   expiry:'10 Aug 2026', days:11, joined:false, done:false, progress:0, total:4 },
];

function renderChallenges() {
  document.getElementById('challenges-list').innerHTML = challenges.map(ch => {
    const pct    = (ch.progress / ch.total) * 100;
    const urgent = ch.days <= 3;
    const bg     = ch.done ? '#1E5C3A' : '#FAF6EE';
    const col    = ch.done ? '#fff' : '#2A2118';
    return `<div class="${ch.done ? 'batik-bg' : ''}" style="padding:24px;border-radius:12px;
      border:${ch.done ? '1.5px solid #1E5C3A' : urgent ? '1.5px solid #C4522A' : '1px solid #D5CABF'};
      background:${bg};color:${col};display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
          <span style="font-size:16px;font-weight:700">${ch.title}</span>
          ${urgent && !ch.done ? '<span style="font-size:9px;font-family:\'JetBrains Mono\',monospace;letter-spacing:0.07em;color:#fff;background:#C4522A;border-radius:4px;padding:2px 8px">EXPIRING SOON</span>' : ''}
          ${ch.done ? '<span style="font-size:9px;font-family:\'JetBrains Mono\',monospace;letter-spacing:0.07em;color:rgba(255,255,255,0.45)">COMPLETED</span>' : ''}
        </div>
        <p style="font-size:13px;opacity:0.75;margin-bottom:12px;line-height:1.55">${ch.desc}</p>
        <div style="font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:16px;line-height:1.55;
          background:${ch.done ? 'rgba(255,255,255,0.08)' : '#EDE5D4'};color:${ch.done ? 'rgba(255,255,255,0.7)' : '#8A7D6E'}">
          <strong style="color:${ch.done ? 'rgba(255,255,255,0.9)' : '#2A2118'}">Requirements:</strong> ${ch.req}
        </div>
        ${ch.joined ? `
          <div style="height:5px;background:${ch.done ? 'rgba(255,255,255,0.15)' : '#EDE5D4'};border-radius:4px;margin-bottom:6px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${ch.done ? 'rgba(255,255,255,0.6)' : '#D98A2E'};border-radius:4px;transition:width 0.4s"></div>
          </div>
          <div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:${ch.done ? 'rgba(255,255,255,0.45)' : '#8A7D6E'}">${ch.progress} / ${ch.total} requirements met</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:160px">
        <div style="text-align:right">
          <div style="font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:${ch.done ? 'rgba(255,255,255,0.85)' : '#D98A2E'}">+${ch.pts} pts</div>
          <div style="font-size:12px;opacity:0.7;margin-bottom:4px">${ch.badge}</div>
          <div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:${urgent && !ch.done ? '#C4522A' : ch.done ? 'rgba(255,255,255,0.4)' : '#8A7D6E'};font-weight:${urgent && !ch.done ? 700 : 400}">Expires ${ch.expiry}</div>
          <div style="font-size:11px;color:${urgent && !ch.done ? '#C4522A' : ch.done ? 'rgba(255,255,255,0.4)' : '#8A7D6E'}">${ch.days} days left</div>
        </div>
        ${!ch.joined ? `<button class="btn-primary" style="width:100%" onclick="joinChallenge(${ch.id})">Join Challenge</button>` : ''}
        ${ch.joined && !ch.done ? `<button class="btn-secondary" style="width:100%" onclick="progressChallenge(${ch.id})">Simulate Visit +1</button>` : ''}
        ${ch.done ? `<div style="font-size:12px;color:rgba(255,255,255,0.45);font-family:'JetBrains Mono',monospace">✓ DONE</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function joinChallenge(id) {
  challenges = challenges.map(c => c.id === id ? {...c, joined:true} : c);
  renderChallenges();
}

function progressChallenge(id) {
  challenges = challenges.map(c => {
    if (c.id !== id) return c;
    const np = Math.min(c.progress + 1, c.total);
    const done = np >= c.total;
    if (done) {
      const ch = challenges.find(x => x.id === id);
      document.getElementById('done-title').textContent = ch.title;
      document.getElementById('done-pts').textContent = '+' + ch.pts;
      document.getElementById('done-badge').textContent = ch.badge.split(' ')[0];
      document.getElementById('complete-modal').style.display = 'flex';
    }
    return {...c, progress:np, done};
  });
  renderChallenges();
}

// ── Init ──────────────────────────────────────────────────────
renderChallenges();
</script>
<script>
// Nav routing: maps data-navigate keys to Spring routes
(function () {
  var ROUTES = {
    checkin: '/CheckInPage',
    badges: '/BadgePage',
    rewards: '/RewardPage',
    challenges: '/ChallengePage',
    admin: '/AdminChallengePage'
  };
  document.getElementById('nav-menu').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-navigate]');
    if (!btn) return;
    var key = btn.getAttribute('data-navigate');
    if (ROUTES[key]) window.location.href = ROUTES[key];
  });
})();
</script>
</body>
</html>
