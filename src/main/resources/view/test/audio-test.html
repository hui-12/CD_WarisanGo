<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarisanGo - AI Heritage Discovery Test</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <link rel="stylesheet" th:href="@{/css/test/audio-test.css}" />
  </head>

  <body>
    <div class="container py-4">
      <!-- Navigation -->
      <div class="mb-4 d-flex gap-2 flex-wrap">
        <a href="/" class="btn btn-outline-primary">Home</a>
        <a href="/admin/ai_discovery" class="btn btn-primary">Discovery Page</a>
      </div>

      <!-- Header -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="mb-2">AI Heritage Discovery Pipeline</h2>

          <p class="text-muted mb-4">
            Test the complete pipeline from YouTube → Audio Extraction → AssemblyAI → Gemini.
          </p>

          <form id="processingForm">
            <label class="form-label fw-semibold"> YouTube Video URL </label>

            <div class="input-group">
              <input
                id="videoUrl"
                type="url"
                class="form-control"
                placeholder="https://www.youtube.com/watch?v=..."
                required
              />

              <button id="process-button" class="btn btn-success" type="submit">Process Video</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Result Section -->
      <div id="resultSection" class="d-none">
        <!-- Overall Status -->
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h5>Processing Status</h5>

            <div id="status-message" class="alert alert-info mb-0">Waiting...</div>
          </div>
        </div>

        <!-- Audio -->
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h5>Step 1 · Audio Extraction</h5>

            <p id="audioStatus" class="text-muted mb-3">Waiting...</p>

            <div id="audioFileContainer" class="d-none">
              <label class="form-label">Temporary Audio File</label>

              <input id="audioFile" type="text" class="form-control" readonly />
            </div>
          </div>
        </div>

        <!-- Transcript -->
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h5>Step 2 · AssemblyAI Transcript</h5>

            <p id="transcriptionStatus" class="text-muted mb-3">Waiting...</p>

            <div id="transcriptContainer" class="d-none">
              <textarea id="transcript" class="form-control" rows="12" readonly></textarea>
            </div>
          </div>
        </div>

        <!-- Gemini JSON -->
        <div class="card shadow-sm">
          <div class="card-body">
            <h5>Step 3 · Gemini Structured JSON</h5>

            <p id="extractionStatus" class="text-muted mb-3">Waiting...</p>

            <div id="jsonContainer" class="d-none">
              <pre id="jsonResult" class="json-box"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script th:src="@{/js/test/audio-test.js}"></script>
  </body>
</html>
