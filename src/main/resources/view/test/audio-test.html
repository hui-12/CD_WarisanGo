<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarisanGo - Audio Extraction Test</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            th:href="@{/css/test/audio-test.css}">
</head>

<body>

<main class="container test-container">

    <section class="test-card">

        <header class="test-header">

            <h1>Audio Extraction Test</h1>

            <p>
                Test the YouTube audio URL extraction using yt-dlp.
            </p>

        </header>

        <form id="audioTestForm">

            <div class="mb-3">

                <label
                        for="videoUrl"
                        class="form-label">

                    YouTube Video URL

                </label>

                <input
                        type="url"
                        id="videoUrl"
                        name="videoUrl"
                        class="form-control"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required>

            </div>

            <button
                    type="submit"
                    id="testButton"
                    class="btn btn-primary">

                Get Audio URL

            </button>

        </form>

    </section>


    <section
            id="resultSection"
            class="test-card result-card d-none">

        <h2>Result</h2>

        <div
                id="statusMessage"
                class="alert"
                role="alert">
        </div>

        <div
                id="audioUrlContainer"
                class="d-none">

            <label
                    for="audioUrl"
                    class="form-label">

                Audio URL

            </label>

            <textarea
                    id="audioUrl"
                    class="form-control"
                    rows="5"
                    readonly></textarea>

            <button
                    type="button"
                    id="transcribeButton"
                    class="btn btn-success mt-3">

                Transcribe Audio

            </button>

        </div>

        <div class="mt-4">

            <h3>Transcript</h3>

            <div
                    id="transcript"
                    class="border rounded p-3">
            </div>

        </div>

    </section>

</main>

<script
        th:src="@{/js/test/audio-test.js}">
</script>

</body>

</html>
