<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WarisanGo - AI Extraction Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/test/ai-extraction-test.css}" />
  </head>

  <body>
    <div class="mt-4">
      <a href="/test/audio-test" class="btn btn-primary"> Audio Extraction </a>

      <a href="/test/transcription-test" class="btn btn-primary"> Transcription </a>

      <a href="/test/ai-extraction-test" class="btn btn-primary"> Content Extraction </a>
    </div>
    <main class="container py-5">
      <div class="page-header mb-4">
        <h1>AI Heritage Extraction Test</h1>
        <p class="text-muted">Test Gemini extraction from a transcript.</p>
      </div>

      <!-- Transcript Input -->

      <section class="card shadow-sm mb-4">
        <div class="card-header">
          <h5 class="mb-0">Transcript Input</h5>
        </div>

        <div class="card-body">
          <label for="transcript" class="form-label"> Transcript </label>

          <textarea
            id="transcript"
            class="form-control"
            rows="12"
            placeholder="Paste the AssemblyAI transcript here..."
          ></textarea>

          <div class="mt-3">
            <button type="button" id="extractButton" class="btn btn-primary">Extract Heritage Information</button>

            <button type="button" id="clearButton" class="btn btn-secondary ms-2">Clear</button>
          </div>
        </div>
      </section>

      <!-- Processing Status -->

      <section class="card shadow-sm mb-4">
        <div class="card-header">
          <h5 class="mb-0">Processing Status</h5>
        </div>

        <div class="card-body">
          <div id="status-message" class="status-message">Ready</div>
        </div>
      </section>

      <!-- Extraction Result -->

      <section class="card shadow-sm">
        <div class="card-header">
          <h5 class="mb-0">Extraction Result</h5>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered">
              <tbody>
                <tr>
                  <th>Name</th>
                  <td id="name">-</td>
                </tr>

                <tr>
                  <th>Address</th>
                  <td id="address">-</td>
                </tr>

                <tr>
                  <th>State</th>
                  <td id="state">-</td>
                </tr>

                <tr>
                  <th>City</th>
                  <td id="city">-</td>
                </tr>

                <tr>
                  <th>Location</th>
                  <td id="location">-</td>
                </tr>

                <tr>
                  <th>Description</th>
                  <td id="description">-</td>
                </tr>

                <tr>
                  <th>Operating Hour</th>
                  <td id="operatingHour">-</td>
                </tr>
              </tbody>
            </table>
          </div>

          <h6 class="mt-4">Raw JSON Response</h6>

          <pre id="rawJson" class="json-output">No result yet.</pre>
        </div>
      </section>
    </main>

    <script th:src="@{/js/test/ai-extraction-test.js}"></script>
  </body>
</html>
