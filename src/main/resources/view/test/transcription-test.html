<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WarisanGo - Speech-to-Text Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/test/transcription-test.css}" />
  </head>

  <body>
    <div class="mt-4">
      <a href="/test/audio-test" class="btn btn-primary"> Audio Extraction </a>

      <a href="/test/transcription-test" class="btn btn-primary"> Transcription </a>

      <a href="/test/ai-extraction-test" class="btn btn-primary"> Content Extraction </a>
    </div>

    <main class="container test-container">
      <section class="test-card">
        <h1>Speech-to-Text Test</h1>

        <p class="text-muted">Test AssemblyAI using a direct audio URL.</p>

        <form id="transcriptionTestForm">
          <div class="mb-3">
            <label for="audio-url" class="form-label"> Audio URL </label>

            <textarea
              id="audio-url"
              class="form-control"
              rows="5"
              placeholder="Paste the audio URL retrieved by yt-dlp..."
              required
            >
            </textarea>
          </div>

          <button type="submit" id="transcribeButton" class="btn btn-primary">Transcribe Audio</button>
        </form>
      </section>

      <section id="resultSection" class="test-card d-none">
        <h2>Transcription Result</h2>

        <div id="status-message" class="alert" role="alert"></div>

        <div id="transcriptContainer">
          <label for="transcript" class="form-label"> Transcript </label>

          <textarea id="transcript" class="form-control" rows="15" readonly> </textarea>
        </div>
      </section>
    </main>

    <script th:src="@{/js/test/transcription-test.js}"></script>
  </body>
</html>
