<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${business.name} + ' - Details — WarisanGo'">Business Details — WarisanGo</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global Styles (With static href fallback) -->
  <link rel="stylesheet" href="/css/global.css" th:href="@{/css/global.css}">
  <!-- Assignment + Tailwind compiled styles -->
  <link rel="stylesheet" th:href="@{/css/bundle.css}" href="/css/bundle.css">
  <link rel="stylesheet" th:href="@{/css/assignment.css}" href="/css/assignment.css">
  <!-- Page-specific stylesheet -->
  <link rel="stylesheet" th:href="@{/css/business-heritage.css}" href="/css/business-heritage.css">
</head>
<body>
  <!-- Navbar fragment -->
  <div th:replace="fragments :: navbar('directory')"></div>

  <main class="container container--detail">
    <a class="back" href="/">← Back to directory</a>

    <div class="card card--detail">
      <div class="hero">
        <div>
          <img th:src="${business.photos[0]}" th:alt="${business.name} + ' photo'" th:title="${business.name}" alt="${business.name} photo" title="${business.name}" src="/images/business-default.jpg"/>
        </div>
        <aside class="info">
          <h1 th:text="${business.name}">Business Name</h1>
          <div class="meta" th:text="${business.category} + ' • ' + ${business.city} + ', ' + ${business.state} + ' • ★ ' + ${business.rating}"></div>
          <div class="address" th:text="${business.address}"></div>
          <div>
            <a th:href="@{'/'}" class="link">Back</a>
          </div>
        </aside>
      </div>

      <section style="margin-top:16px">
        <h3>Description</h3>
        <p th:text="${business.description}">Business description</p>
      </section>

      <section style="margin-top:16px" id="photos">
        <h3>Photos</h3>
        <div th:if="${business.photos == null or #lists.isEmpty(business.photos)}">No photos available for this business.</div>
        <div class="photos" th:if="${business.photos != null}">
          <img th:each="p : ${business.photos}" th:src="${p}" th:alt="${business.name} + ' photo'" th:title="${business.name}" alt="${business.name} photo" title="${business.name}" />
        </div>
      </section>
    </div>
  </main>

  <!-- Footer fragment -->
  <div th:replace="footer :: global"></div>

  <!-- Page-specific script -->
  <script src="/js/business-heritage.js" th:src="@{/js/business-heritage.js}"></script>
</body>
</html>
