<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarisanGo - Interactive Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #e5e3df;
        }
        .popup-content h3 {
            margin-bottom: 5px;
            color: #8b0000;
        }
        .popup-content p {
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .popup-rating {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const map = L.map('map').setView([3.1390, 101.6869], 12);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            try {
                const response = await fetch('/interactive-map/api/approved');
                const businesses = await response.json();

                const bounds = [];

                businesses.forEach(b => {
                    if (b.latitude && b.longitude) {
                        const marker = L.marker([b.latitude, b.longitude]).addTo(map);
                        
                        const popupHtml = `
                            <div class="popup-content">
                                <h3>${escapeHtml(b.name)}</h3>
                                <p class="popup-rating">Rating: ${b.averageRating ? b.averageRating : 'N/A'} ⭐</p>
                                <p><strong>Location:</strong> ${escapeHtml(b.city)}, ${escapeHtml(b.state)}</p>
                                <p>${escapeHtml(b.description)}</p>
                            </div>
                        `;
                        
                        marker.bindPopup(popupHtml);
                        bounds.push([b.latitude, b.longitude]);
                    }
                });

                // Auto-fit map zoom to encompass all loaded markers
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

            } catch (error) {
                console.error("Failed to fetch map markers:", error);
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
