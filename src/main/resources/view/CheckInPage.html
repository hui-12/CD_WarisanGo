<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WarisanGo — Check In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}"/>
</head>
<body>
<!-- NAV -->
<header id="site-header">
  <div class="nav-inner">
    <div class="wordmark">
      <span style="font-size:20px">🍛</span>
      <span class="wordmark-text">WarisanGo</span>
      <span class="wordmark-badge">REWARDS</span>
    </div>
    <nav class="nav-links" id="nav-menu">
      <button type="button" class="nav-btn" th:classappend="${activePage == 'checkin'} ? ' active'" data-navigate="checkin">Check In</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'badges'} ? ' active'" data-navigate="badges">Badges</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'rewards'} ? ' active'" data-navigate="rewards">Rewards</button>
      <button type="button" class="nav-btn" th:classappend="${activePage == 'challenges'} ? ' active'" data-navigate="challenges">Challenges</button>
      <button type="button" class="nav-btn admin-btn" th:classappend="${activePage == 'admin'} ? ' active'" data-navigate="admin">Admin</button>
    </nav>
  </div>
  <div class="batik-divider" style="opacity:0.5"></div>
</header>

<div id="page-checkin" class="page active">
<main>
  <h1>Check In at a Heritage Business</h1>
  <p class="muted">Visit a heritage food business and confirm your GPS location within 50 metres to earn reward points.</p>
  <div class="batik-divider" style="margin:24px 0"></div>

  <!-- Points banner -->
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;">
    <div>
      <div class="caption">Your points balance</div>
      <div class="mono" style="font-size:30px;font-weight:600;line-height:1.1" id="ci-points-display">320 <span style="font-size:14px;color:#8A7D6E">pts</span></div>
    </div>
    <div id="ci-tier-badge" style="padding:10px 18px;border:2px solid #C4762A;border-radius:12px;text-align:center">
      <div class="caption">TIER</div>
      <div style="font-size:17px;font-weight:700;color:#C4762A">Bronze</div>
    </div>
  </div>

  <!-- Business grid -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:24px" id="biz-grid"></div>

  <!-- Status area -->
  <div id="ci-status"></div>
</main>
</div>
<script>
// ── Shared state ──────────────────────────────────────────────
let totalPoints = 320;

function getTier(pts) {
  if (pts >= 2000) return { name: 'Platinum', color: '#5B7080' };
  if (pts >= 1000) return { name: 'Gold',     color: '#D98A2E' };
  if (pts >= 500)  return { name: 'Silver',   color: '#8A9BA8' };
  return { name: 'Bronze', color: '#C4762A' };
}

function updatePointsUI() {
  const t = getTier(totalPoints);
  document.getElementById('ci-points-display').innerHTML =
    totalPoints.toLocaleString() + ' <span style="font-size:14px;color:#8A7D6E">pts</span>';
  const tb = document.getElementById('ci-tier-badge');
  tb.style.borderColor = t.color;
  tb.innerHTML = `<div class="caption">TIER</div><div style="font-size:17px;font-weight:700;color:${t.color}">${t.name}</div>`;
}

// ══════════════════════════════════════
// PAGE 1: CHECK IN
// ══════════════════════════════════════
const BUSINESSES = [
  { id: 1, name: "Pak Ali's Nasi Lemak Corner",  address: "14 Jalan Masjid India, KL",       pts: 50 },
  { id: 2, name: "Aunty Lim's Char Kway Teow",   address: "88 Chulia Street, Penang",         pts: 40 },
  { id: 3, name: "Roti Canai Warisan",             address: "22 Jalan Tuanku Abdul Halim, KL", pts: 35 },
  { id: 4, name: "Mak Cik Siti's Rendang House",  address: "5 Lorong Haji Taib, KL",          pts: 60 },
];

let checkedIn = [];
let selectedBiz = null;

function renderBizGrid() {
  const grid = document.getElementById('biz-grid');
  grid.innerHTML = BUSINESSES.map(biz => {
    const done   = checkedIn.includes(biz.id);
    const active = selectedBiz === biz.id;
    return `<button onclick="selectBiz(${biz.id})" style="text-align:left;padding:20px;border-radius:12px;
      border:${active ? '2px solid #C4522A' : '1px solid #D5CABF'};
      background:${done ? '#EDE5D4' : active ? '#C4522A' : '#F3EDE0'};
      color:${active ? '#fff' : done ? '#8A7D6E' : '#2A2118'};
      cursor:${done ? 'default' : 'pointer'};transition:all 0.15s;width:100%">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <span style="font-size:14px;font-weight:600;line-height:1.3">${biz.name}</span>
        ${done ? '<span style="font-size:9px;font-family:\'JetBrains Mono\',monospace;color:#8A7D6E;border:1px solid #D5CABF;border-radius:4px;padding:2px 6px;flex-shrink:0;margin-left:6px">VISITED</span>' : ''}
      </div>
      <div style="font-size:12px;opacity:0.65;margin-bottom:10px">${biz.address}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${active ? 'rgba(255,255,255,0.75)' : '#D98A2E'}">+${biz.pts} pts</div>
    </button>`;
  }).join('');
}

function selectBiz(id) {
  if (checkedIn.includes(id)) return;
  selectedBiz = id;
  renderBizGrid();
  const biz = BUSINESSES.find(b => b.id === id);
  document.getElementById('ci-status').innerHTML = `
    <div class="card" style="background:#EDE5D4;margin-top:0">
      <p style="font-size:14px;margin-bottom:16px">Ready to check in at <strong>${biz.name}</strong>? Your GPS location will be verified.</p>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="doCheckIn(${id})">Check In</button>
        <button class="btn-secondary" onclick="cancelCI()">Cancel</button>
      </div>
    </div>`;
}

function cancelCI() { selectedBiz = null; renderBizGrid(); document.getElementById('ci-status').innerHTML = ''; }

function doCheckIn(id) {
  const biz = BUSINESSES.find(b => b.id === id);
  document.getElementById('ci-status').innerHTML = statusCard('loading','Detecting your location…','Capturing GPS coordinates and verifying distance to the business.','','','','');
  setTimeout(() => {
    if (checkedIn.includes(id)) {
      document.getElementById('ci-status').innerHTML = statusCard('warning','Already checked in recently',"You've already earned points here recently. Come back after the cooldown period.",'Choose Another','cancelCI()','','');
      return;
    }
    if (Math.random() < 0.2) {
      document.getElementById('ci-status').innerHTML = statusCard('error',`Move closer to ${biz.name} to check in`,'You must be within 50 metres of the business. Try again when you arrive.','Try Again',`retryCI(${id})`,'Change Business','cancelCI()');
      return;
    }
    totalPoints += biz.pts;
    checkedIn.push(id);
    selectedBiz = null;
    updatePointsUI();
    renderBizGrid();
    document.getElementById('ci-status').innerHTML = statusCard('success',`+${biz.pts} points awarded`,`Check-in confirmed at ${biz.name}. Updated balance: ${totalPoints.toLocaleString()} pts.`,'Check In Somewhere Else','cancelCI()','','');
  }, 1800);
}

function retryCI(id) { document.getElementById('ci-status').innerHTML = ''; selectBiz(id); }

function statusCard(type, title, body, a1label, a1fn, a2label, a2fn) {
  const cfg = {
    loading: { bg:'#F3EDE0', border:'#D5CABF', icon:'⟳' },
    error:   { bg:'#FDF0EB', border:'#C4522A', icon:'✕' },
    warning: { bg:'#FEF8EC', border:'#D98A2E', icon:'!' },
    success: { bg:'#EAF3EE', border:'#1E5C3A', icon:'✓' },
  }[type];
  return `<div style="padding:24px;border:2px solid ${cfg.border};border-radius:12px;background:${cfg.bg}">
    <div style="display:flex;gap:12px;align-items:flex-start">
      <span style="font-size:18px;flex-shrink:0;color:${cfg.border}">${cfg.icon}</span>
      <div>
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">${title}</div>
        <div style="font-size:13px;color:#8A7D6E;margin-bottom:${a1label ? 16 : 0}px">${body}</div>
        ${a1label ? `<div style="display:flex;gap:10px">
          <button class="btn-primary" onclick="${a1fn}">${a1label}</button>
          ${a2label ? `<button class="btn-secondary" onclick="${a2fn}">${a2label}</button>` : ''}
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

// ── Init ──────────────────────────────────────────────────────
updatePointsUI();
renderBizGrid();
</script>
<script>
// Nav routing: maps data-navigate keys to Spring routes
(function () {
  var ROUTES = {
    checkin: '/CheckInPage',
    badges: '/BadgePage',
    rewards: '/RewardPage',
    challenges: '/ChallengePage',
    admin: '/AdminChallengePage'
  };
  document.getElementById('nav-menu').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-navigate]');
    if (!btn) return;
    var key = btn.getAttribute('data-navigate');
    if (ROUTES[key]) window.location.href = ROUTES[key];
  });
})();
</script>
</body>
</html>
