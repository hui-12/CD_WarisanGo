
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review & Rating | WarisanGo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f7f4ef;color:#333}
.topbar{background:#fff;padding:18px 40px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center}
.topbar a{text-decoration:none;color:#b86b35;font-weight:600}
.container{max-width:1200px;margin:30px auto;padding:0 20px}
.hero{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.hero img{width:100%;height:340px;object-fit:cover}
.hero-body{display:flex;justify-content:space-between;align-items:flex-end;padding:25px}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{color:#666;margin:5px 0}
.btn{background:#c47a3c;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600}
.summary{display:grid;grid-template-columns:320px 1fr;gap:20px;margin:30px 0}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.avg{font-size:54px;font-weight:700;color:#c47a3c}
.stars{font-size:24px;color:#f6b01e;margin:10px 0}
.bar-row{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;margin:8px 0}
.bar{height:10px;background:#ececec;border-radius:20px;overflow:hidden}
.fill{height:100%;background:#c47a3c}
.review-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 18px rgba(0,0,0,.06);margin-bottom:20px}
.review-head{display:flex;justify-content:space-between}
.user{display:flex;gap:15px}
.avatar{width:55px;height:55px;border-radius:50%;background:#ddd}
.photos{display:flex;gap:10px;margin-top:12px}
.photos img{width:90px;height:90px;border-radius:10px;object-fit:cover}
.actions{margin-top:15px;display:flex;gap:10px}
button{border:none;border-radius:8px;padding:10px 16px;cursor:pointer}
.edit{background:#ffc857}
.delete{background:#d9534f;color:#fff}
</style>
</head>
<body>

<div class="topbar">
<a href="/">← Warisan</a>
<span>/</span>
<span>Reviews</span>
</div>

<div class="container">

<div class="hero">
<img th:src="${business.businessImage}" src="https://picsum.photos/1200/500" alt="">
<div class="hero-body">
<div>
<h1 th:text="${business.businessName}">Heritage Business</h1>
<p th:text="${business.businessAddress}">Business Address</p>
<p th:text="${business.category}">Heritage Business</p>
</div>

<a class="btn"
th:href="@{/reviews/create/{id}(id=${business.businessId})}">
Write Review
</a>
</div>
</div>

<div class="summary">

<div class="card">
<h3>Average Rating</h3>
<div class="avg" th:text="${averageRating}">4.5</div>
<div class="stars">★★★★★</div>
<p><span th:text="${totalReviews}">0</span> Reviews</p>
</div>

<div class="card">
<h3>Rating Distribution</h3>

<div class="bar-row"><span>5★</span><div class="bar"><div class="fill" style="width:90%"></div></div><span>90%</span></div>
<div class="bar-row"><span>4★</span><div class="bar"><div class="fill" style="width:65%"></div></div><span>65%</span></div>
<div class="bar-row"><span>3★</span><div class="bar"><div class="fill" style="width:35%"></div></div><span>35%</span></div>
<div class="bar-row"><span>2★</span><div class="bar"><div class="fill" style="width:15%"></div></div><span>15%</span></div>
<div class="bar-row"><span>1★</span><div class="bar"><div class="fill" style="width:5%"></div></div><span>5%</span></div>

</div>

</div>

<h2 style="margin-bottom:20px">Visitor Reviews</h2>

<div th:each="review : ${reviews}" class="review-card">

<div class="review-head">

<div class="user">
<div class="avatar"></div>

<div>
<h3 th:text="${review.touristName}">Visitor Name</h3>
<div class="stars">★★★★★</div>
<small th:text="${review.createdAt}">2026-08-07</small>
</div>
</div>

</div>

<p style="margin-top:15px"
th:text="${review.reviewText}">
Review content...
</p>

<div class="photos">
<img src="https://picsum.photos/100?1">
<img src="https://picsum.photos/100?2">
</div>

<div class="actions">

<a th:href="@{/reviews/edit/{id}(id=${review.reviewId})}">
<button class="edit" type="button">Edit</button>
</a>

<form method="post"
th:action="@{/reviews/delete/{id}(id=${review.reviewId})}">
<input type="hidden"
name="businessId"
th:value="${business.businessId}">
<button class="delete" type="submit">Delete</button>
</form>

</div>

</div>

</div>

</body>
</html>
