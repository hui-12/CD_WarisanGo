<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <!-- Include Head Metadata Fragment -->
  <th:block th:replace="~{fragments/fragments :: head('WarisanGo - Interactive Map')}"></th:block>
  
  <!-- Leaflet CSS (Required for map rendering) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Page-Specific Stylesheet -->
  <link rel="stylesheet" href="/css/interactive-map.css" th:href="@{/css/interactive-map.css}">
</head>

<body>

  <!-- Include Sticky Navbar Fragment -->
  <div th:replace="~{fragments/fragments :: navbar('map')}"></div>

  <!-- Main Content -->
  <main class="main-layout">
    <div class="page-header">
      <p class="page-tagline">INTERACTIVE MAP</p>
      <h1 class="page-title">Find Heritage Near You</h1>
      <p class="page-subtitle">Explore approved heritage businesses across Peninsular Malaysia.</p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-group">
        <input type="text" id="map-search-input" placeholder="Search by name or city..." class="map-search-input" />
        <button id="map-search-btn" class="btn-search-primary">Search</button>
      </div>

      <select id="state-select" class="map-select">
        <option value="All">All States</option>
        <option value="Johor">Johor</option>
        <option value="Kedah">Kedah</option>
        <option value="Kelantan">Kelantan</option>
        <option value="Melaka">Melaka</option>
        <option value="Negeri Sembilan">Negeri Sembilan</option>
        <option value="Pahang">Pahang</option>
        <option value="Perak">Perak</option>
        <option value="Perlis">Perlis</option>
        <option value="Pulau Pinang">Pulau Pinang</option>
        <option value="Sabah">Sabah</option>
        <option value="Sarawak">Sarawak</option>
        <option value="Selangor">Selangor</option>
        <option value="Terengganu">Terengganu</option>
      </select>

      <select id="radius-select" class="map-select">
        <option value="0">Any Distance</option>
        <option value="1">Within 1 km</option>
        <option value="5">Within 5 km</option>
        <option value="10">Within 10 km</option>
        <option value="25">Within 25 km</option>
        <option value="50">Within 50 km</option>
        <option value="100">Within 100 km</option>
        <option value="250">Within 250 km</option>
        <option value="500">Within 500 km</option>
      </select>
    </div>

    <!-- Map Grid Layout -->
    <div class="map-grid">
      <div class="map-canvas-container">
        <div id="map-canvas"></div>
      </div>

      <div class="map-sidebar">
        <div class="sidebar-header">
          <span id="locations-count" class="locations-count-text">0 locations</span>
          <select id="sort-select" class="sidebar-sort-select">
            <option value="none">Default order</option>
            <option value="rating-desc">Rating: High → Low</option>
          </select>
        </div>
        <div id="locations-list" class="sidebar-list-container"></div>
      </div>
    </div>
  </main>

  <!-- Include Footer & Global Scripts Fragment -->
  <div th:replace="~{fragments/footer :: global}"></div>
  
  <!-- Leaflet JS (Required before interactive-map.js) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Page-Specific Script -->
  <script src="/js/interactive-map.js" th:src="@{/js/interactive-map.js}"></script>
</body>
</html>
