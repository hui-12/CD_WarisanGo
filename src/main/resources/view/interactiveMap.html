<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Include Head Metadata Fragment -->
<head th:replace="~{fragments/fragments :: head('WarisanGo - Interactive Map')}"></head>
<!-- Page-Specific Stylesheet -->
<link rel="stylesheet" href="/css/interactive-map.css" th:src="@{/css/interactive-map.css}">

<body>

  <!-- Include Sticky Navbar Fragment -->
  <div th:replace="~{fragments/fragments :: navbar('map')}"></div>

  <!-- Main Content -->
  <main class="main-layout">
    <div class="page-header">
      <p class="page-tagline">INTERACTIVE MAP</p>
      <h1 class="page-title">Find Heritage Near You</h1>
      <p class="page-subtitle">Explore approved heritage businesses across Peninsular Malaysia.</p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-input-group">
        <input type="text" id="map-search-input" placeholder="Search by name or city..." class="map-search-input" />
        <button id="map-search-btn" class="btn-search-primary">Search</button>
      </div>

      <select id="state-select" class="map-select">
        <option value="All">All States</option>
        <option value="Kuala Lumpur">Kuala Lumpur</option>
        <option value="Penang">Penang</option>
        <option value="Perak">Perak</option>
      </select>

      <select id="radius-select" class="map-select">
        <option value="0">Any Distance</option>
        <option value="5">Within 5 km</option>
        <option value="10">Within 10 km</option>
      </select>
    </div>

    <!-- Map Grid Layout -->
    <div class="map-grid">
      <div class="map-canvas-container">
        <div id="map-canvas"></div>
      </div>

      <div class="map-sidebar">
        <div class="sidebar-header">
          <span id="locations-count" class="locations-count-text">0 locations</span>
          <select id="sort-select" class="sidebar-sort-select">
            <option value="none">Default order</option>
            <option value="rating-desc">Rating: High → Low</option>
          </select>
        </div>
        <div id="locations-list" class="sidebar-list-container"></div>
      </div>
    </div>
  </main>

  <!-- Include Footer & Global Scripts Fragment -->
  <div th:replace="~{fragments/footer :: global}"></div>
  
  <!-- Page-Specific Script -->
  <script src="/js/interactive-map.js" th:src="@{/js/interactive-map.js}"></script>
</body>
</html>
