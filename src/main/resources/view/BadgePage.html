<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/fragments :: head('WarisanGo - Badges')}"></th:block>
  <link rel="stylesheet" href="/css/rewards.css" th:href="@{/css/rewards.css}">
  <link rel="stylesheet" href="/css/badges.css" th:href="@{/css/badges.css}">
</head>
<body>
  <div th:replace="~{fragments/fragments :: navbar('badges')}"></div>
  <main class="badge-page">
    <header class="badge-page-header">
      <p class="badge-kicker">Achievements</p>
      <h1>Your Achievement Badges</h1>
      <p>Badges unlock automatically from your real WarisanGo activity.</p>
    </header>

    <section id="badge-stats" class="badge-stats" aria-label="Badge totals"></section>

    <nav class="badge-filters" aria-label="Filter badges">
      <button class="badge-tab active" type="button" data-badge-filter="all">All Badges</button>
      <button class="badge-tab" type="button" data-badge-filter="earned">Earned</button>
      <button class="badge-tab" type="button" data-badge-filter="locked">Locked</button>
    </nav>

    <section id="badge-grid" class="badge-grid" aria-live="polite">
      <div class="badge-loading">Loading badges from Firebase...</div>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: global}"></div>
  <script src="/js/badges.js" th:src="@{/js/badges.js}"></script>
</body>
</html>
